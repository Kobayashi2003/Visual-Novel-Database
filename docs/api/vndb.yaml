openapi: 3.1.0

info:
  title: vndb
  version: "1.0"
  description: |
    A local mirror of the [VNDB Kana API](https://api.vndb.org/kana), with a
    crawler and an editing layer on top.

    Two surfaces sit side by side, and they are not alternatives — they answer
    different questions:

    * **The query API** (`/{id}`, `/{prefix}`) is what the site itself calls.
      One path segment carries both the entity type and, optionally, the id:
      `/v17` is a visual novel, `/v` is a search across visual novels. It reads
      **local-first with background refresh**, so a page renders from the local
      database and a stale entry is re-fetched behind the request.

    * **The resource API** (`/vns`, `/characters`, …) is the crawler's and the
      operator's surface. It is explicit about where data comes from — `GET`
      reads local, `POST` reads upstream, `PUT` re-crawls, `PATCH` edits by
      hand — and it exposes soft-delete recovery under `/trash`.

    The resource routes exist in an identical set for all seven entity types,
    so they are documented once below with a `{resource}` placeholder rather
    than seven times over.

    **Field names mirror VNDB's.** `results`, `count` and `more` are inherited
    from upstream on purpose, so a caller can move between this API and the
    real one without a translation layer.

    See ./README.md for the conventions shared by every service.

servers:
  - url: http://localhost:30709/vndb
    description: Behind the Caddy edge (requires a session)
  - url: http://localhost:5000
    description: Direct, loopback only

tags:
  - name: query
    description: The site-facing read API
  - name: resources
    description: Per-type CRUD; the crawler's surface
  - name: related
    description: Entities reachable from one entity
  - name: trash
    description: Soft-deleted rows
  - name: tasks
    description: Results of work queued with "?sync=false"
  - name: admin
    description: Loopback-only operator controls

paths:
  /{id}:
    get:
      tags: [query]
      summary: One entity, or a search across one type
      description: |
        The path segment is a VNDB id (`v17`, `c250`, `g42`) for a single
        entity, or a bare type prefix (`v`, `c`, `g`) to search that type.
        Unlike the resource routes the prefix is **mandatory** here, because it
        is what selects the type.

        Reads local-first: a fresh local row is served directly, a stale one is
        served immediately and re-fetched in the background (`meta.refreshing`),
        and a missing one is fetched from upstream before answering. `from`
        overrides that choice.

        Filters are passed straight through as query parameters and follow the
        Kana API's own vocabulary.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: |
            `v17` for one visual novel; `v` to search visual novels. Prefixes:
            `v` vn, `r` release, `c` character, `p` producer, `s` staff,
            `g` tag, `i` trait.
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/ResponseSize"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Reverse"
        - $ref: "#/components/parameters/Count"
      responses:
        "200":
          $ref: "#/components/responses/Page"
        "400":
          description: |
            Unknown type prefix, malformed id, or a non-integer paging
            parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: The query API has been switched off by an operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /{id}/rg:
    get:
      tags: [query]
      summary: A visual novel's relation graph
      description: |
        The connected component of VN-to-VN relations rooted at one visual
        novel — sequels, prequels, side stories, shared settings. Visual novels
        only; any other prefix is a `400`.

        Returns a graph object, not a page, so it carries no `count`/`more`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: A visual novel id, e.g. `v17`.
        - name: depth
          in: query
          schema: { type: integer, minimum: 1 }
          description: |
            How many relation hops to follow. Clamped to the server's cap,
            which is also the default — the graph is walked breadth-first and
            an unbounded walk on a large series is expensive.
        - name: official_only
          in: query
          schema: { type: boolean, default: false }
          description: Follow only relations VNDB marks as official.
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          description: |
                            A visual novel reduced to card fields: `id`,
                            `title`, `alttitle`, `titles`, `image`, `released`,
                            `devstatus`.
                      edges:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            source: { type: string }
                            target: { type: string }
                            relation: { type: string }
        "400":
          description: Not a visual novel id, or a malformed one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /{resource}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - $ref: "#/components/parameters/Sync"
    get:
      tags: [resources]
      summary: Read a page from the local database
      description: |
        Never contacts upstream. Any unrecognised query parameter is treated as
        a filter on the local columns.
      parameters:
        - $ref: "#/components/parameters/ResponseSize"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Reverse"
        - $ref: "#/components/parameters/Count"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [resources]
      summary: Search upstream VNDB
      description: |
        Forwards the body to the Kana API. A `response_size` of `large` also
        schedules the results to be stored locally, so searching warms the
        mirror.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Kana API search parameters, plus the paging keys
                (`response_size`, `page`, `limit`, `sort`, `reverse`, `count`),
                which are read off the body rather than the query string here.
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [resources]
      summary: Re-crawl every entity of this type
      description: |
        Refreshes each row from upstream, skipping any that was edited by hand.
        Long-running; call with `?sync=false`.
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
    patch:
      tags: [resources]
      summary: Edit several entities by hand
      description: |
        Marks each touched row as hand-edited, which excludes it from automatic
        re-crawls from then on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "400":
          description: Body missing, or not a list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [resources]
      summary: Soft-delete every entity of this type
      description: Rows move to `/trash/{resource}` and can be recovered.
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }

  /{resource}/{id}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Sync"
    get:
      tags: [resources]
      summary: Read one entity from the local database
      parameters:
        - $ref: "#/components/parameters/ResponseSize"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [resources]
      summary: Read one entity from upstream VNDB
      parameters:
        - $ref: "#/components/parameters/ResponseSize"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [resources]
      summary: Re-crawl one entity
      description: |
        Fetches the current upstream state and overwrites the local row,
        creating it if absent. Refreshing this way clears the hand-edited mark.
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [resources]
      summary: Edit one entity by hand
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "400":
          description: Malformed id, or an empty body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [resources]
      summary: Soft-delete one entity
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }

  /{resource}/{id}/{related}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Related"
      - $ref: "#/components/parameters/Sync"
    get:
      tags: [related]
      summary: Related entities, from the local database
      description: |
        Which pairs exist is fixed per type — see the `related` parameter. An
        unsupported pair is a `404`, since the route is not registered at all.
      parameters:
        - $ref: "#/components/parameters/ResponseSize"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Reverse"
        - $ref: "#/components/parameters/Count"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [related]
      summary: Related entities, from upstream VNDB
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [related]
      summary: Re-crawl the related entities
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [related]
      summary: Soft-delete the related entities
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trash/{resource}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - $ref: "#/components/parameters/Sync"
    get:
      tags: [trash]
      summary: List soft-deleted entities
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Reverse"
        - $ref: "#/components/parameters/Count"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [trash]
      summary: Recover every soft-deleted entity of this type
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
    delete:
      tags: [trash]
      summary: Permanently delete the trash for this type
      description: Irreversible; the rows are gone after this.
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }

  /trash/{resource}/{id}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Sync"
    get:
      tags: [trash]
      summary: Read one soft-deleted entity
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [trash]
      summary: Recover one soft-deleted entity
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [trash]
      summary: Permanently delete one soft-deleted entity
      responses:
        "200": { $ref: "#/components/responses/WriteOutcome" }
        "202": { $ref: "#/components/responses/TaskQueued" }
        "400": { $ref: "#/components/responses/BadId" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [tasks]
      summary: Result of a queued task
      description: |
        Once the task has finished this answers exactly as the synchronous call
        would have — including its status code, so a task that ended in
        `NOT_FOUND` is reported as `404` here too.
      responses:
        "200":
          description: Finished; the body is the task's own result.
        "202":
          description: Still running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    description: Celery's own state name, e.g. `PENDING`.
        "404":
          description: The task finished without finding anything.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The task raised. The traceback is in the service log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [tasks]
      summary: Revoke a queued task
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404":
          description: No task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/query-mode:
    get:
      tags: [admin]
      summary: Read the query API's data-source mode
      responses:
        "200":
          description: The current mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: "#/components/schemas/QueryMode" }
    post:
      tags: [admin]
      summary: Set the query API's data-source mode
      description: |
        Forces every query-API read to one source, or disables the surface
        entirely. Held in process memory, so it resets when the service
        restarts and does not propagate to Celery workers — deliberate, since
        only the web routes read it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/QueryMode" }
      responses:
        "200":
          description: The mode now in effect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: "#/components/schemas/QueryMode" }
        "400":
          description: Unknown mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/backfill:
    post:
      tags: [admin]
      summary: Populate one column across a whole table
      description: |
        Used after a schema change adds a column the existing rows lack. Runs in
        a background thread and returns immediately; one backfill at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, field]
              properties:
                resource_type: { type: string }
                field: { type: string }
      responses:
        "200":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: started }
        "400":
          description: Missing `resource_type` or `field`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A backfill is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/backfill/status:
    get:
      tags: [admin]
      summary: Progress of the running or last backfill
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  last:
                    type: [object, "null"]
                    description: Null while the first backfill is still running.
                    properties:
                      updated: { type: integer }
                      total: { type: integer }
                      error: { type: [string, "null"] }

components:
  parameters:
    Resource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [vns, releases, characters, producers, staff, tags, traits]
      description: |
        Plural type name. Note `staff` is its own plural — there is no
        `/staffs`.
    Related:
      name: related
      in: path
      required: true
      schema:
        type: string
        enum: [vns, releases, characters, producers, staff, tags, traits]
      description: |
        Only the pairs that exist are routed; anything else is a `404`.

        | From | Available |
        | --- | --- |
        | `vns` | `vns`, `tags`, `characters`, `producers`, `staff`, `releases` |
        | `characters` | `vns`, `traits` |
        | `releases` | `vns`, `producers` |
        | `producers` | `vns`, `releases` |
        | `staff` | `vns` |
        | `tags` | `vns` |
        | `traits` | `characters` |
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        Accepted with or without its letter prefix — `/vns/v17` and `/vns/17`
        are the same entity. The type is already fixed by the path, so the
        prefix is only there to match VNDB's own notation; it is normalized
        before the route runs, and a mismatched one is a `400`.
    ResponseSize:
      name: response_size
      in: query
      schema:
        type: string
        enum: [small, large]
      description: |
        `small` returns card fields; `large` returns the full entity. Defaults
        to `small` on the resource routes and `large` on the query API, each
        matching what its callers actually render.
    From:
      name: from
      in: query
      schema:
        type: string
        enum: [local, remote]
      description: |
        Pin the read to one source instead of letting freshness decide.
        Overridden by an operator-set query mode.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based; out-of-range values are clamped, not rejected.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      schema: { type: string, default: id }
      description: A column name. An unknown one is a `400`.
    Reverse:
      name: reverse
      in: query
      schema: { type: boolean, default: false }
    Count:
      name: count
      in: query
      schema: { type: boolean, default: true }
      description: "`false` omits `count`, skipping a second query."
    Sync:
      name: sync
      in: query
      schema: { type: boolean, default: true }
      description: |
        `false` queues the work on Celery and returns `202` with a task id
        instead of waiting. Worth using on any route that touches every row.

  schemas:
    QueryMode:
      type: string
      enum: [default, local, remote, disabled]
      description: |
        `default` freshness-aware; `local` never contacts upstream; `remote`
        always does; `disabled` answers `503`.

    Message:
      type: object
      properties:
        message:
          type: string
          description: For humans. Not stable — never parse it.

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: |
            From the shared vocabulary in ./README.md — this service adds no
            codes of its own.
          examples: [invalid_request, not_found, method_not_allowed, conflict, unavailable, internal_error]
        message:
          type: string
          description: For humans. Not stable — never parse it.

  responses:
    Page:
      description: |
        A page of entities. `results` is always an array, even for a lookup
        that can only match one thing — the shape does not change with the
        number of hits.
      content:
        application/json:
          schema:
            type: object
            required: [results]
            properties:
              results:
                type: array
                items: { type: object }
              count:
                type: integer
                description: Total matching rows. Omitted when `count=false`.
              more: { type: boolean }
              source:
                type: string
                enum: [local, remote]
                description: Which side answered.
              refreshing:
                type: boolean
                description: |
                  Present and `true` when the data served was stale and a
                  background re-crawl is under way. The next request will
                  likely see fresher data.
    WriteOutcome:
      description: |
        The write succeeded. The body reports what changed — a row, a count, or
        a per-id map of outcomes, depending on the route.
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                description: Shape depends on the route.
    TaskQueued:
      description: Queued for background processing (`?sync=false`).
      content:
        application/json:
          schema:
            type: object
            required: [task_id]
            properties:
              task_id: { type: string }
    Message:
      description: Succeeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    NotFound:
      description: |
        Nothing matched. Note this covers an empty search as well as an unknown
        id — vndb does not distinguish them, so a client rendering a list should
        treat `404` as an empty page.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadId:
      description: The id is not valid for this type.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
