<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1035" viewBox="0 0 1560 1035" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="1560" height="1035" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="46" font-size="28" font-weight="700" fill="#111827">Visual Novel Database — Architecture</text>
  <text x="60" y="76" font-size="15" fill="#4B5563">One public port. Every backend call is gated at the edge, so the services themselves carry no auth code.</text>

  <!-- Browser -->
  <rect x="60" y="110" width="250" height="62" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="185" y="140" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Browser</text>
  <text x="185" y="160" font-size="12" fill="#374151" text-anchor="middle">httpOnly JWT cookies ride along</text>
  <line x1="185" y1="172" x2="185" y2="209" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caddy edge -->
  <rect x="60" y="215" width="1440" height="130" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
  <text x="86" y="250" font-size="21" font-weight="700" fill="#111827">Caddy  ·  :30709</text>
  <text x="86" y="278" font-size="13" fill="#374151">The only public ingress. Routes by path prefix, and each backend prefix exposes an explicit allowlist of the routes the frontend actually uses.</text>
  <text x="86" y="300" font-size="13" fill="#374151">Allowlisted requests are first probed with forward_auth against userserve /auth/verify (204 = pass, 401 = reject). Anything off the list is answered 403 and never forwarded —</text>
  <text x="86" y="322" font-size="13" fill="#374151">so /vndb/admin, the write routes and /tasks/* stay reachable only on the loopback ports. imgserve cache hits are served straight off disk by Caddy; Flask never runs.</text>

  <!-- Caddy -> app tier arrows -->
  <line x1="185" y1="345" x2="185" y2="394" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="345" x2="442" y2="394" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682" y1="345" x2="682" y2="394" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="922" y1="345" x2="922" y2="394" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1152" y1="345" x2="1152" y2="394" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1385" y1="345" x2="1385" y2="394" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gated badges -->
  <circle cx="442" cy="370" r="7" fill="#BE185D"/>
  <circle cx="682" cy="370" r="7" fill="#BE185D"/>
  <circle cx="1152" cy="370" r="7" fill="#BE185D"/>
  <circle cx="1385" cy="370" r="7" fill="#BE185D"/>
  <text x="200" y="375" font-size="11" fill="#6B7280">pages — not gated</text>

  <!-- App tier -->
  <rect x="60" y="400" width="250" height="150" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="76" y="428" font-size="16" font-weight="700" fill="#111827">Next.js 16  ·  :5010</text>
  <text x="76" y="450" font-size="12" fill="#374151">standalone build</text>
  <text x="76" y="470" font-size="11" fill="#4B5563">basePath /visual-novel-database</text>
  <text x="76" y="488" font-size="11" fill="#4B5563">all pages are client components</text>
  <text x="76" y="506" font-size="11" fill="#4B5563">proxy.ts redirects signed-out</text>
  <text x="76" y="524" font-size="11" fill="#4B5563">visitors to /login</text>

  <rect x="335" y="400" width="215" height="150" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="351" y="428" font-size="16" font-weight="700" fill="#111827">vndb  ·  :5000</text>
  <text x="351" y="450" font-size="12" fill="#374151">core data + search</text>
  <text x="351" y="470" font-size="11" fill="#4B5563">Postgres vndb</text>
  <text x="351" y="488" font-size="11" fill="#4B5563">Redis db0 (cache)</text>
  <text x="351" y="506" font-size="11" fill="#4B5563">Celery · Redis db1/db2</text>
  <text x="351" y="524" font-size="11" fill="#4B5563">crawls the Kana API</text>

  <rect x="575" y="400" width="215" height="150" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="591" y="428" font-size="16" font-weight="700" fill="#111827">imgserve  ·  :5001</text>
  <text x="591" y="450" font-size="12" fill="#374151">image cache</text>
  <text x="591" y="470" font-size="11" fill="#4B5563">Postgres imgserve</text>
  <text x="591" y="488" font-size="11" fill="#4B5563">Redis db3 · db8</text>
  <text x="591" y="506" font-size="11" fill="#4B5563">Celery · Redis db4/db5</text>
  <text x="591" y="524" font-size="11" fill="#4B5563">fetches t.vndb.org → disk</text>

  <rect x="815" y="400" width="215" height="150" rx="10" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.5"/>
  <text x="831" y="428" font-size="16" font-weight="700" fill="#111827">userserve  ·  :5002</text>
  <text x="831" y="450" font-size="12" fill="#374151">identity &amp; collections</text>
  <text x="831" y="470" font-size="11" fill="#4B5563">Postgres userserve</text>
  <text x="831" y="488" font-size="11" fill="#4B5563">Redis db7 (codes, blocklist)</text>
  <text x="831" y="506" font-size="11" fill="#4B5563">JWT cookies · CSRF · SMTP</text>
  <text x="831" y="524" font-size="11" font-weight="600" fill="#BE185D">answers /auth/verify</text>

  <rect x="1055" y="400" width="195" height="150" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="1071" y="428" font-size="16" font-weight="700" fill="#111827">transserve  ·  :5003</text>
  <text x="1071" y="450" font-size="12" fill="#374151">en→ja translation</text>
  <text x="1071" y="470" font-size="11" fill="#4B5563">Postgres transserve</text>
  <text x="1071" y="488" font-size="11" fill="#4B5563">dictionary + passage</text>
  <text x="1071" y="506" font-size="11" fill="#4B5563">memory, keyed by hash</text>

  <rect x="1270" y="400" width="230" height="150" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="1286" y="428" font-size="16" font-weight="700" fill="#111827">musicserve  ·  :5004</text>
  <text x="1286" y="450" font-size="12" fill="#374151">VN theme music</text>
  <text x="1286" y="470" font-size="11" fill="#4B5563">music files on disk</text>
  <text x="1286" y="488" font-size="11" fill="#4B5563">stream · cover · meta</text>
  <text x="1286" y="506" font-size="11" fill="#4B5563">no database</text>

  <!-- Backing stores -->
  <text x="60" y="600" font-size="15" font-weight="700" fill="#111827">Backing stores</text>
  <rect x="60" y="615" width="460" height="105" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="76" y="643" font-size="16" font-weight="700" fill="#111827">PostgreSQL  ·  :5432</text>
  <text x="76" y="666" font-size="12" fill="#374151">One database per service:</text>
  <text x="76" y="686" font-size="11" fill="#4B5563">vndb · imgserve · userserve · transserve</text>
  <text x="76" y="706" font-size="11" fill="#4B5563">Runs as a Windows service, not under the launcher.</text>

  <rect x="545" y="615" width="460" height="105" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="561" y="643" font-size="16" font-weight="700" fill="#111827">Redis  ·  :6379</text>
  <text x="561" y="666" font-size="12" fill="#374151">db0 vndb cache · db1/db2 vndb Celery</text>
  <text x="561" y="686" font-size="11" fill="#4B5563">db3 imgserve cache · db4/db5 imgserve Celery · db8 imgserve</text>
  <text x="561" y="706" font-size="11" fill="#4B5563">db7 userserve — verification codes and the JWT blocklist</text>

  <rect x="1030" y="615" width="470" height="105" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="1046" y="643" font-size="16" font-weight="700" fill="#111827">Local disk</text>
  <text x="1046" y="666" font-size="12" fill="#374151">Image cache — served directly by Caddy on a hit</text>
  <text x="1046" y="686" font-size="11" fill="#4B5563">Music library (musicserve)</text>
  <text x="1046" y="706" font-size="11" fill="#4B5563">Scheduled database backups</text>

  <!-- External -->
  <text x="60" y="770" font-size="15" font-weight="700" fill="#111827">External services</text>
  <rect x="60" y="785" width="460" height="90" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="76" y="813" font-size="16" font-weight="700" fill="#111827">VNDB Kana API</text>
  <text x="76" y="836" font-size="12" fill="#374151">api.vndb.org/kana</text>
  <text x="76" y="857" font-size="11" fill="#4B5563">Crawled into Postgres on a schedule (vndb)</text>

  <rect x="545" y="785" width="460" height="90" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="561" y="813" font-size="16" font-weight="700" fill="#111827">t.vndb.org</text>
  <text x="561" y="836" font-size="12" fill="#374151">Cover art and screenshots</text>
  <text x="561" y="857" font-size="11" fill="#4B5563">Mirrored to the local cache on first miss (imgserve)</text>

  <rect x="1030" y="785" width="470" height="90" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1046" y="813" font-size="16" font-weight="700" fill="#111827">SMTP  ·  QQ / Gmail</text>
  <text x="1046" y="836" font-size="12" fill="#374151">Verification codes and password-reset mail</text>
  <text x="1046" y="857" font-size="11" fill="#4B5563">Dispatched asynchronously (userserve)</text>

  <!-- Off-edge tooling -->
  <rect x="60" y="915" width="460" height="90" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="76" y="943" font-size="16" font-weight="700" fill="#111827">logserve  ·  :5005</text>
  <text x="76" y="966" font-size="12" fill="#374151">Developer tool — browse and replay recorded searches</text>
  <text x="76" y="987" font-size="11" fill="#4B5563">Reads the vndb logs table. No Caddy route: loopback only.</text>

  <!-- Legend -->
  <rect x="545" y="915" width="955" height="90" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="561" y="941" font-size="13" font-weight="700" fill="#111827">Legend</text>
  <circle cx="570" cy="962" r="7" fill="#BE185D"/>
  <text x="586" y="967" font-size="12" fill="#374151">Gated prefix — forward_auth must return 204 first</text>
  <rect x="563" y="982" width="14" height="12" rx="3" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/>
  <text x="586" y="993" font-size="12" fill="#374151">userserve — the single authority on identity</text>
  <text x="1060" y="967" font-size="12" fill="#374151">Launcher: backend/launch.py (procserve)</text>
  <text x="1060" y="993" font-size="12" fill="#374151">start-prod.ps1 owns Caddy + Next.js</text>
</svg>
